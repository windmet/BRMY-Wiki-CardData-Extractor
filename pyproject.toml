[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brmy-masterdata-toolkit"
version = "0.2.0.dev0"
description = "Break My Case masterdata extraction tools for Wiki contributors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lz4>=4.0.0",
  "msgpack>=1.0.0",
  "mutagen>=1.45.0",
  "openpyxl>=3.0.0",
]

[project.scripts]
brmy-masterdata = "toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolkit*"]

